version: 2.1

jobs:
  test:
    parameters:
      node-version:
        type: string
    docker:
      - image: cimg/node:<< parameters.node-version >>
    resource_class: small
    steps:
      - checkout

      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@10.13.1

      - restore_cache:
          keys:
            - pnpm-cache-v1-{{ checksum "pnpm-lock.yaml" }}-<< parameters.node-version >>
            - pnpm-cache-v1-

      - run:
          name: Install dependencies
          command: pnpm install

      - save_cache:
          key: pnpm-cache-v1-{{ checksum "pnpm-lock.yaml" }}-<< parameters.node-version >>
          paths:
            - ~/.local/share/pnpm/store

      - run:
          name: Run tests
          command: pnpm test:run

      - run:
          name: Build project
          command: pnpm build

  check-format:
    docker:
      - image: cimg/node:22.12
    resource_class: small
    steps:
      - checkout

      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@10.13.1

      - run:
          name: Check formatting
          command: make check-format

  test-templates:
    docker:
      - image: cimg/node:22.12
    steps:
      - checkout

      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@10.13.1

      - run:
          name: Build and lint all templates
          # Each template is its own package with its own lockfile, so it is
          # installed and checked independently. @skipruntime/native has a build
          # script that is not needed for tsc/eslint, so installs use
          # --ignore-scripts. verify-deps-before-run is disabled so that
          # `pnpm build`/`pnpm lint` do not trigger a second (failing) install.
          environment:
            npm_config_verify_deps_before_run: "false"
          command: |
            set -euo pipefail
            for dir in templates/default \
                       templates/with_postgres \
                       templates/with_react_vite/reactive_service \
                       templates/with_react_vite/frontend; do
              echo "=== $dir ==="
              (cd "$dir" && pnpm install --frozen-lockfile --ignore-scripts && pnpm build && pnpm lint)
            done

workflows:
  ci:
    jobs:
      - test:
          matrix:
            parameters:
              node-version: ["22.12", "24.10"]
      - check-format
      - test-templates
