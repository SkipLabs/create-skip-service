version: 2.1

# Bun is the package manager; Node.js (from the cimg/node image) stays the
# runtime for tsc, Vitest and the templates' node-gyp build. Bun ignores the
# packageManager field, so the version is pinned here.
commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"

jobs:
  test:
    parameters:
      node-version:
        type: string
    docker:
      - image: cimg/node:<< parameters.node-version >>
    resource_class: small
    steps:
      - checkout
      - install-bun

      - restore_cache:
          keys:
            - bun-cache-v1-{{ checksum "bun.lock" }}-<< parameters.node-version >>
            - bun-cache-v1-

      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

      - save_cache:
          key: bun-cache-v1-{{ checksum "bun.lock" }}-<< parameters.node-version >>
          paths:
            - ~/.bun/install/cache

      - run:
          name: Run tests
          command: bun run test:run

      - run:
          name: Build project
          command: bun run build

  check-format:
    docker:
      - image: cimg/node:22.12
    resource_class: small
    steps:
      - checkout
      - install-bun

      - run:
          name: Check formatting
          command: make check-format

  test-templates:
    docker:
      - image: cimg/node:22.12
    resource_class: small
    steps:
      - checkout
      - install-bun

      - run:
          name: Build and lint all templates
          # Each template is its own package with its own lockfile, so it is
          # installed and checked independently. @skipruntime/native has a
          # node-gyp install script that is not needed for tsc/eslint, so the
          # Makefile installs with --ignore-scripts.
          command: make check-templates

workflows:
  ci:
    jobs:
      - test:
          matrix:
            parameters:
              node-version: ["22.12", "24.10"]
      - check-format
      - test-templates
